 on this device.</p></main><dialog id="modal"><form id="form"><div class="formhead"><h2 id="formtitle">Add entry</h2><button type="button" class="close" id="close">×</button></div><input type="hidden" id="editid"><div class="field"><label>Type</label><select id="type"><option value="expense">Expense</option><option value="income">Income</option></select></div><div class="formgrid"><div class="field"><label>Date</label><input id="date" type="date" required></div><div class="field"><label>Amount</label><input id="amount" type="number" min="0.01" step="0.01" placeholder="0.00" required></div></div><div class="field"><label>Category</label><input id="category" list="categories" placeholder="e.g. Groceries" required><datalist id="categories"><option>Food</option><option>Transport</option><option>Housing</option><option>Shopping</option><option>Bills</option><option>Health</option><option>Salary</option><option>Freelance</option><option>Other</option></datalist></div><div class="field"><label>Note <span style="font-weight:400">(optional)</span></label><input id="note" maxlength="90" placeholder="A little detail"></div><button class="submit">Save entry</button></form></dialog><script>
const $=s=>document.querySelector(s), today=new Date();let entries=JSON.parse(localStorage.getItem('finchEntries')||'[]'),view='monthly',offset=0;const money=n=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0}).format(n);const iso=d=>{let x=new Date(d);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`};document.body.classList.toggle('dark',localStorage.getItem('aniTheme')==='dark');const themeButton=document.getElementById('themeToggle');function syncThemeButton(){themeButton.innerHTML=document.body.classList.contains('dark')?'☀ <span>Light mode</span>':'☾ <span>Dark mode</span>'}themeButton.addEventListener('click',()=>{document.body.classList.toggle('dark');localStorage.setItem('aniTheme',document.body.classList.contains('dark')?'dark':'light');syncThemeButton()});syncThemeButton();let hour=today.getHours();document.getElementById('greeting').textContent=(hour<12?'Good morning':hour<18?'Good afternoon':'Good evening')+' — here’s your money at a glance.';$('#today').textContent=today.toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'});function bounds(){let d=new Date(today);if(view==='daily'){d.setDate(d.getDate()+offset);return [iso(d),iso(d)]}if(view==='weekly'){d.setDate(d.getDate()+offset*7);let start=new Date(d);start.setDate(d.getDate()-((d.getDay()+6)%7));let end=new Date(start);end.setDate(start.getDate()+6);return [iso(start),iso(end)]}d.setDate(1);d.setMonth(d.getMonth()+offset);let end=new Date(d.getFullYear(),d.getMonth()+1,0);return [iso(d),iso(end)]}function render(){let [a,b]=bounds(),start=new Date(a+'T00:00:00'),end=new Date(b+'T00:00:00');$('#period').textContent=view==='daily'?start.toLocaleDateString('en-IN',{day:'numeric',month:'long',year:'numeric'}):view==='weekly'?`${start.toLocaleDateString('en-IN',{day:'numeric',month:'short'})} – ${end.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}`:start.toLocaleDateString('en-IN',{month:'long',year:'numeric'});let shown=entries.filter(x=>x.date>=a&&x.date<=b);let inc=shown.filter(x=>x.type==='income').reduce((s,x)=>s+x.amount,0),out=shown.filter(x=>x.type==='expense').reduce((s,x)=>s+x.amount,0);$('#income').textContent=money(inc);$('#expense').textContent=money(out);$('#net').textContent=money(inc-out);$('#balance').textContent=money(entries.reduce((s,x)=>s+(x.type==='income'?x.amount:-x.amount),0));let cats={};shown.filter(x=>x.type==='expense').forEach(x=>cats[x.category]=(cats[x.category]||0)+x.amount);let sorted=Object.entries(cats).sort((x,y)=>y[1]-x[1]);$('#chart').innerHTML=sorted.length?`<div class="vchart">${sorted.map(([c,n])=>`<div class="vbar"><strong>${money(n)}</strong><div class="vtrack"><div class="vfill" style="height:${Math.max(5,n/Math.max(...sorted.map(q=>q[1]))*100)}%"></div></div><span>${esc(c)}</span></div>`).join('')}</div>`:'<div class="empty">No spending in this period yet.</div>';let list=[...shown].sort((x,y)=>y.date.localeCompare(x.date));$('#entries').innerHTML=list.length?list.map(x=>`<div class="entry"><div class="left"><div class="icon">${x.type==='income'?'↗':'↘'}</div><div><div class="name">${esc(x.category)}</div><div class="meta">${new Date(x.date+'T00:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short'})}${x.note?' · '+esc(x.note):''}</div></div></div><div><div class="amt ${x.type==='expense'?'exp':''}">${x.type==='income'?'+':'−'}${money(x.amount)}</div><div class="actions"><button onclick="editEntry('${x.id}')">Edit</button><button onclick="deleteEntry('${x.id}')">Delete</button></div></div></div>`).join(''):'<div class="empty">Nothing logged for this period.</div>';$('#next').disabled=false}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}$('#tabs').onclick=e=>{if(e.target.dataset.view){view=e.target.dataset.view;offset=0;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b===e.target));render()}};document.getElementById('prev').addEventListener('click',e=>{e.preventDefault();offset-=1;render()});document.getElementById('next').addEventListener('click',e=>{e.preventDefault();offset+=1;render()});function persist(){localStorage.setItem('finchEntries',JSON.stringify(entries));render()}$('#exportCsv').onclick=()=>{if(!entries.length){alert('There are no entries to export yet.');return}const columns=['date','type','amount','category','note'];const quote=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const csv=[columns.join(','),...entries.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(x=>columns.map(c=>quote(x[c])).join(','))].join('\r\n');const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='ani-expenses-'+iso(today)+'.csv';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url)};$('#add').onclick=()=>{ $('#form').reset();$('#editid').value='';$('#date').value=iso(today);$('#formtitle').textContent='Add entry';$('#modal').showModal()};$('#close').onclick=()=>$('#modal').close();$('#form').onsubmit=e=>{e.preventDefault();let id=$('#editid').value;let obj={id:id||crypto.randomUUID(),type:$('#type').value,date:$('#date').value,amount:Number($('#amount').value),category:$('#category').value.trim(),note:$('#note').value.trim()};entries=id?entries.map(x=>x.id===id?obj:x):[obj,...entries];persist();$('#modal').close()};window.editEntry=id=>{let x=entries.find(x=>x.id===id);$('#editid').value=id;$('#type').value=x.type;$('#date').value=x.date;$('#amount').value=x.amount;$('#category').value=x.category;$('#note').value=x.note;$('#formtitle').textContent='Edit entry';$('#modal').showModal()};window.deleteEntry=id=>{if(confirm('Delete this entry?')){entries=entries.filter(x=>x.id!==id);persist()}};function drawGoal(){let g=JSON.parse(localStorage.getItem('finchGoal')||'{"name":"Emergency fund","saved":0,"target":0}');$('#goalname').textContent=g.name;$('#goalprogress').textContent=money(g.saved)+' saved · '+Math.round(g.target?Math.min(g.saved/g.target*100,100):0)+'%';$('#goaltarget').textContent='Target '+money(g.target);$('#goalfill').style.width=(g.target?Math.min(g.saved/g.target*100,100):0)+'%'}$('#editgoal').onclick=()=>{let g=JSON.parse(localStorage.getItem('finchGoal')||'{"name":"Emergency fund","saved":0,"target":0}');let name=prompt('What are you saving for?',g.name);if(name===null)return;let target=Number(prompt('Savings target amount (₹)',g.target||''));if(!target||target<0)return;let saved=Number(prompt('Amount saved so far (₹)',g.saved||0));if(saved<0)return;localStorage.setItem('finchGoal',JSON.stringify({name:name.trim()||'Savings goal',saved,target}));drawGoal()};drawGoal();render();</script></body></html>
